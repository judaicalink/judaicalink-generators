[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judaicalink-generators"
version = "0.1.0"
description = "Dataset generator for JudaicaLink — generates RDF datasets."
authors = [
    { name = "Benjamin Schnabel", email = "bschnabel@hs-mannheim.de" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "django>=4.2,<5.0",
    "rdflib>=6.3.2",
    "toml>=0.10.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
    "isort",
    "pytest",
    "pytest-django",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[project.urls]
Homepage = "https://github.com/judaicalink/judaicalink-generators"
Documentation = "https://labs.judaicalink.org/docs/generators"
Repository = "https://github.com/judaicalink/judaicalink-generators"
Issues = "https://github.com/judaicalink/judaicalink-generators/issues"

[tool.setuptools]
packages = [
    "generator",
    "jl_generators",
]

[tool.setuptools.package-data]
"generator" = ["*.py"]
"jl_generators" = ["templates/**/*", "static/**/*"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jl_generators.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[project.scripts]
jlgen = "jl_generators.management.commands.jlgen:Command"
jlgen-cli = "scripts.cli_jlgen:main"
